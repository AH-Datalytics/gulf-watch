name: Ingest

on:
  schedule:
    # GitHub's scheduler is best-effort and was dropping/delaying runs at
    # :00/:30. Four off-peak attempts per hour keep the effective freshness
    # near 30 minutes even when an individual scheduled event is skipped.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingest
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}
        run: python ingest/ingest.py
